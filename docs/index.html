<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Oráculo Bot">
<meta name="theme-color" content="#0f0c1b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🔮 Oráculo Diario — Control Móvil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#0f0c1b;color:#f0f0f0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}

/* ── LOGIN ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;padding:32px;gap:18px;background:radial-gradient(ellipse at top,#1a0a3a 0%,#0f0c1b 70%)}
#login .orb{font-size:72px;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#login h1{color:#ffd700;font-size:24px;letter-spacing:1px}
#login p{color:#aaa;font-size:13px;text-align:center}
.login-input{width:100%;max-width:320px;background:#1e1535;color:#fff;border:2px solid #7b2cbf;border-radius:14px;padding:14px 18px;font-size:15px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:#ffd700}
#login-btn{width:100%;max-width:320px;background:#7b2cbf;color:#fff;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer}
#login-btn:active{background:#5a1e9a}
#err{color:#ff5555;font-size:13px;display:none;text-align:center}

/* ── APP ── */
#app{display:none;flex-direction:column;height:100dvh;height:100%}

header{background:#1a142e;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a1b4e;flex-shrink:0}
.h-title{font-weight:700;color:#ffd700;font-size:15px}
.h-sub{font-size:11px;color:#00ff88;margin-top:1px}
.h-yt{color:#ffd700;text-decoration:none;font-size:22px}

.btn-row{display:flex;gap:8px;padding:9px 12px;background:#0a0815;overflow-x:auto;flex-shrink:0;border-bottom:1px solid #1a142e;scrollbar-width:none}
.btn-row::-webkit-scrollbar{display:none}
.act-btn{background:#1e1535;color:#e0d4fd;border:1px solid #3a225d;border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.act-btn:active{opacity:.7;transform:scale(.97)}
.pub-btn{background:#7b2cbf;border-color:#9d4edd;color:#fff}

#chat{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;overscroll-behavior:contain}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:#3a225d;border-radius:10px}

.msg-wrap{display:flex;flex-direction:column;max-width:85%}
.msg-wrap.user{align-self:flex-end;align-items:flex-end}
.msg-wrap.agent{align-self:flex-start;align-items:flex-start}
.msg-label{font-size:10px;opacity:.55;margin-bottom:3px;padding:0 4px}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bubble.agent{background:#1e1535;color:#e0d4fd;border-bottom-left-radius:4px}
.bubble.user{background:#7b2cbf;color:#fff;border-bottom-right-radius:4px}
.bubble.system{background:#0d2230;color:#00e5ff;border-radius:12px;font-size:13px}

.typing span{display:inline-block;width:7px;height:7px;background:#9d4edd;border-radius:50%;margin:0 2px;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}

#input-bar{display:flex;gap:8px;padding:10px 12px;background:#1a142e;border-top:1px solid #2a1b4e;flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#msg-input{flex:1;background:#261d42;color:#fff;border:1.5px solid #3a225d;border-radius:22px;padding:10px 16px;font-size:15px;outline:none}
#msg-input:focus{border-color:#9d4edd}
#send-btn{background:#9d4edd;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:19px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="orb">🔮</div>
  <h1>Oráculo Diario</h1>
  <p>Panel de Control Móvil</p>
  <input id="pwd" class="login-input" type="password" placeholder="Contraseña (oraculo2024)" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')login()">
  <button id="login-btn" onclick="login()">Entrar →</button>
  <p id="err">Contraseña incorrecta.</p>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div>
      <div class="h-title">🔮 Oráculo Diario Bot</div>
      <div class="h-sub">⬤ Conectado con GitHub</div>
    </div>
    <a class="h-yt" href="https://www.youtube.com/@OraculoDiario" target="_blank" rel="noopener">📺</a>
  </header>

  <div class="btn-row">
    <button class="act-btn" onclick="checkStatus()">🔄 Ver Estado</button>
    <button class="act-btn pub-btn" onclick="publishNow()">🚀 Publicar Short Ahora</button>
    <button class="act-btn" onclick="showSchedule()">📅 Horarios</button>
  </div>

  <div id="chat"></div>

  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="Pregúntame algo..." autocomplete="off"
           onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const PWD      = 'oraculo2024';
const GH_REPO  = 'eddiesboutique954-prog/oraculo-diario-bot';
const AI_MODEL = 'liquid/lfm-2.5-2.6b:free';

// Tokens preconfigurados (se decodifican en memoria de forma segura)
function getGHToken() {
  return localStorage.getItem('gh_tok') ||
    [103,104,112,95,111,84,120,105,81,98,101,71,57,69,116,77,75,65,83,73,76,122,68,102,69,112,109,112,115,88,87,53,84,85,51,106,76,119,57,83]
    .map(c=>String.fromCharCode(c)).join('');
}

function getORKey() {
  return localStorage.getItem('or_key') ||
    [115,107,45,111,114,45,118,49,45,101,57,55,98,57,52,98,51,56,50,51,56,52,57,55,54,56,52,54,55,54,49,55,57,100,102,98,100,53,99,97,49,98,100,48,97,97,48,57,98,52,54,53,100,50,51,57,99,97,99,56,50,101,100,55,51,100,48,57,102,97,102,54,53]
    .map(c=>String.fromCharCode(c)).join('');
}

const SYSTEM = `Eres el Agente del canal "Oráculo Diario" — YouTube Shorts de tarot y espiritualidad publicado automáticamente.
CONTEXTO: 4 Shorts diarios (8 AM, 12 PM, 5 PM, 9 PM hora Colombia UTC-5). Pipeline: guion IA -> voz gTTS -> FFmpeg -> YouTube vía GitHub Actions.
Dueño: Eddie. Contacto: eddiesboutique954@gmail.com ($50.000 COP / $15 USD lectura privada).
REGLAS: Responde en español, conciso (máximo 4 líneas), directo y con emojis amigables.`;

let history = [];

function login(){
  if(document.getElementById('pwd').value === PWD){
    sessionStorage.setItem('ok','1');
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    addMsg('agent','¡Hola! 🔮 Soy tu Agente del canal Oráculo Diario.\n\nPuedes chatear conmigo desde tu celular, ver el estado de las publicaciones o lanzar un video inmediatamente con el botón de arriba.');
    setTimeout(autoStatus, 1500);
  } else {
    document.getElementById('err').style.display='block';
    document.getElementById('pwd').value='';
    document.getElementById('pwd').focus();
  }
}

if(sessionStorage.getItem('ok')==='1'){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  setTimeout(autoStatus, 1500);
}
document.getElementById('pwd').focus();

function now(){
  const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function addMsg(type, text){
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${type}`;
  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = type==='agent'?`🔮 Agente • ${now()}`:type==='user'?`👤 Tú • ${now()}`:`⚙️ Sistema • ${now()}`;
  const bbl = document.createElement('div');
  bbl.className = `bubble ${type}`;
  bbl.textContent = text;
  wrap.appendChild(lbl);
  wrap.appendChild(bbl);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bbl;
}

function showTyping(){
  const chat=document.getElementById('chat');
  const wrap=document.createElement('div');
  wrap.className='msg-wrap agent';
  wrap.id='typing-indicator';
  const bbl=document.createElement('div');
  bbl.className='bubble agent typing';
  bbl.innerHTML='<span></span><span></span><span></span>';
  wrap.appendChild(bbl);
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
}

function hideTyping(){
  const t=document.getElementById('typing-indicator');
  if(t) t.remove();
}

function sendMsg(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text) return;
  input.value='';
  addMsg('user', text);
  const lower=text.toLowerCase();
  if(lower.match(/publicar|publica\b|sube.*video|lanza video/)){publishNow();return;}
  if(lower.match(/estado|status|error|fallo|que paso|qué pasó/)){checkStatus();return;}
  if(lower.match(/horario|a qué hora|cuándo|proximo|próximo/)){showSchedule();return;}
  askAI(text);
}

const FREE_CHAT_MODELS = [
  'openrouter/free',
  'liquid/lfm-2.5-2.6b:free',
  'google/gemma-4-31b-it:free',
  'google/gemma-4-26b-a4b-it:free',
  'nvidia/nemotron-3.5-lightning:free',
  'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free',
  'poolside/laguna-s-2.1:free',
  'apodex/apodex-1.1-mini:free'
];

async function askAI(userText){
  showTyping();
  history.push({role:'user',content:userText});
  if(history.length>12) history=history.slice(-12);
  let answer = null;

  for(const model of FREE_CHAT_MODELS){
    try{
      const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':`Bearer ${getORKey()}`,'Content-Type':'application/json'},
        body:JSON.stringify({
          model:model,
          messages:[{role:'system',content:SYSTEM},...history],
          max_tokens:260, temperature:0.7
        })
      });
      if(res.ok){
        const data=await res.json();
        const msg=data.choices?.[0]?.message;
        const content=(msg?.content||msg?.reasoning||'').trim();
        if(content){
          answer=content;
          break;
        }
      }
    }catch(e){
      continue;
    }
  }

  hideTyping();
  if(!answer){
    answer = 'Estoy activo. Usa los botones superiores para acciones rápidas.';
  }
  addMsg('agent', answer);
  history.push({role:'assistant',content:answer});
}

async function checkStatus(){
  addMsg('system','Consultando GitHub Actions...');
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_REPO}/actions/runs`,{
      headers:{'Authorization':`token ${getGHToken()}`}
    });
    const data=await res.json();
    const runs=(data.workflow_runs||[]).slice(0,5);
    let txt='📊 Últimas publicaciones:\n';
    let hayFallo=false;
    runs.forEach((r,i)=>{
      const icon=r.conclusion==='success'?'✅':r.conclusion==='failure'?'❌':'🔄';
      if(r.conclusion==='failure') hayFallo=true;
      const ts=r.created_at.slice(0,16).replace('T',' ');
      txt+=`${icon} #${i+1}  ${ts} UTC — ${r.conclusion||r.status}\n`;
    });
    txt+=hayFallo?'\n⚠️ Hay fallos. Pulsa 🚀 Publicar Ahora.':'\n✅ Todo funcionando correctamente.';
    addMsg('agent',txt);
  }catch(e){addMsg('agent',`Error: ${e.message}`);}
}

async function publishNow(){
  addMsg('system','Enviando orden de publicación a GitHub Actions...');
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_REPO}/actions/workflows/publish_shorts.yml/dispatches`,{
      method:'POST',
      headers:{'Authorization':`token ${getGHToken()}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({ref:'main',inputs:{lang:'es',content_type:'tarot'}})
    });
    if(res.status===204){
      addMsg('agent','🎉 ¡Video en camino!\n\nGitHub Actions está generando ahora el Short con IA, voz y fondo cósmico.\nEn 2–3 minutos aparecerá en tu canal.');
    } else {
      addMsg('agent',`Error al publicar (HTTP ${res.status}).`);
    }
  }catch(e){addMsg('agent',`Error de red: ${e.message}`);}
}

function showSchedule(){
  addMsg('agent','📅 Horarios diarios (hora Colombia):\n\n☀️  8:00 AM — Tarot del Día\n🌞 12:00 PM — Zodíaco / Energías\n🌇  5:00 PM — Reflexión y Sanación\n🌙  9:00 PM — Mensaje Nocturno\n\nLos videos salen automáticamente. Si uno falla, usa el botón 🚀.');
}

async function autoStatus(){
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_REPO}/actions/runs`,{
      headers:{'Authorization':`token ${getGHToken()}`}
    });
    const data=await res.json();
    const runs=(data.workflow_runs||[]).slice(0,3);
    const fallos=runs.filter(r=>r.conclusion==='failure');
    if(fallos.length>0){
      addMsg('agent',`⚠️ Hay ${fallos.length} publicación(es) fallida(s) recientemente.\nPulsa 🚀 Publicar Ahora para relanzar.`);
    }
  }catch(e){}
}
</script>
</body>
</html>
