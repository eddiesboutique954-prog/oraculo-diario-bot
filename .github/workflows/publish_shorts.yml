name: 🔮 Tarot Bot — 4 Videos Diarios (Resiliente y Auto-Recuperable)

on:
  schedule:
    # Horarios en UTC (Colombia = UTC-5)
    - cron: '0 13 * * *'   # 8:00 AM Colombia
    - cron: '0 17 * * *'   # 12:00 PM Colombia
    - cron: '0 22 * * *'   # 5:00 PM Colombia
    - cron: '0 2 * * *'    # 9:00 PM Colombia
  workflow_dispatch:
    inputs:
      lang:
        description: 'Idioma (es / en / all)'
        required: false
        default: 'es'
      content_type:
        description: 'Tipo de contenido (tarot / zodiaco / reflexion)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias del sistema y FFmpeg + espeak-ng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng

      - name: 📦 Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Crear archivo de credenciales YouTube
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube_token.json
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json

      - name: 🔮 Generar y publicar video (con auto-recuperación y reintentos)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # Determinar tipo de contenido rotando según la hora
          HOUR=$(date +%H)
          if [ "$HOUR" = "13" ]; then TYPE="tarot";
          elif [ "$HOUR" = "17" ]; then TYPE="zodiaco";
          elif [ "$HOUR" = "22" ]; then TYPE="reflexion";
          else TYPE="tarot"; fi

          LANG="${{ github.event.inputs.lang || 'es' }}"
          CTYPE="${{ github.event.inputs.content_type }}"
          if [ -z "$CTYPE" ]; then CTYPE="$TYPE"; fi

          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG="--force"
          fi

          echo "🕐 Hora UTC: $HOUR | Tipo: $CTYPE | Idioma: $LANG | Force: $FORCE_FLAG"

          # Bucle de reintentos inteligente: hasta 3 intentos antes de abortar
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "----------------------------------------------------"
            echo "🚀 Ejecutando intento $RETRY_COUNT de $MAX_RETRIES..."
            echo "----------------------------------------------------"
            
            if python main.py --lang "$LANG" --type "$CTYPE" --upload $FORCE_FLAG; then
              echo "✅ Publicación completada con éxito en el intento $RETRY_COUNT!"
              SUCCESS=1
              break
            else
              echo "⚠️ Falló el intento $RETRY_COUNT. Esperando 20 segundos para reintentar con auto-recuperación..."
              sleep 20
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Fallaron todos los $MAX_RETRIES intentos de publicación."
            exit 1
          fi

      - name: 📊 Reporte de resultado
        if: always()
        run: |
          echo "🏁 Estado del pipeline al finalizar en $(date)"
          ls -lh output/*.mp4 2>/dev/null || echo "No quedaron archivos temporales pesados."
